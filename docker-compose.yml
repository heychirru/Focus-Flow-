version: "3.9"

services:
  # ── API Gateway ────────────────────────────────────────────────────────────
  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - session-service
      - coach-service
      - study-service
    networks:
      - focusflow-net

  # ── Session Service ─────────────────────────────────────────────────────────
  session-service:
    build: ./session-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://session-db:5432/sessions
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${SESSION_DB_PASSWORD:-postgres}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      session-db:
        condition: service_healthy
    networks:
      - focusflow-net

  # ── AI Coach Service ─────────────────────────────────────────────────────────
  coach-service:
    build: ./coach-service
    ports:
      - "8082:8082"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      SESSION_SERVICE_URL: http://session-service:8081
    depends_on:
      - session-service
    networks:
      - focusflow-net

  # ── Study Coach Service ──────────────────────────────────────────────────────
  study-service:
    build: ./study-service
    ports:
      - "8083:8083"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      SPRING_DATASOURCE_URL: jdbc:postgresql://study-db:5432/study
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${STUDY_DB_PASSWORD:-postgres}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      study-db:
        condition: service_healthy
    networks:
      - focusflow-net

  # ── PostgreSQL: Session DB ───────────────────────────────────────────────────
  session-db:
    image: postgres:16
    environment:
      POSTGRES_DB: sessions
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SESSION_DB_PASSWORD:-postgres}
    volumes:
      - session-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sessions"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - focusflow-net

  # ── PostgreSQL: Study DB ─────────────────────────────────────────────────────
  study-db:
    image: postgres:16
    environment:
      POSTGRES_DB: study
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${STUDY_DB_PASSWORD:-postgres}
    volumes:
      - study-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d study"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - focusflow-net

volumes:
  session-data:
  study-data:

networks:
  focusflow-net:
    driver: bridge
