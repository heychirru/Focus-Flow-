server:
  port: 8080

spring:
  config:
    # Maven's spring-boot:run executes the backend from backend/.
    # The project's local .env lives one level above it, at the repository root.
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  application:
    name: focusflow
  profiles:
    active: ${DB_TYPE:mysql}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/focusflow}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    # Keep the local development connection deterministic. This avoids a stale
    # global DB_USERNAME/DB_URL environment variable overriding the project .env.
    url: jdbc:mysql://localhost:3306/focusflow?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: focusflow
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

coach:
  anthropic-api-key: ${ANTHROPIC_API_KEY:}
  session-service-url: http://localhost:8080

study:
  anthropic-api-key: ${ANTHROPIC_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
